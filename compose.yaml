services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cafat
      POSTGRES_USER: cafat
      POSTGRES_PASSWORD: cafat
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafat -d cafat"]
      interval: 5s
      timeout: 3s
      retries: 10
  artemis:
    image: apache/activemq-artemis:2.44.0
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
    ports:
      - "61616:61616"
      - "8161:8161"
volumes:
  postgres_data:
